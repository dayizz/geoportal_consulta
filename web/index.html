<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="geoportal_consulta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>geoportal_consulta</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(140deg, #0b3b2e, #0f4d3a);
      min-height: 100vh;
    }

    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .auth-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
    }

    .auth-card p {
      margin: 0 0 14px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .auth-field label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.92);
    }

    .auth-field input {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
    }

    .auth-field input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .auth-field input:focus {
      border-color: rgba(255, 255, 255, 0.7);
    }

    .auth-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
      color: #0b3b2e;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 12px;
      cursor: pointer;
    }

    .auth-error {
      min-height: 18px;
      margin-top: 10px;
      color: #ffd3d3;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="auth-root" class="auth-wrap">
    <form id="auth-form" class="auth-card">
      <h1>Acceso Protegido</h1>
      <p>Ingresa usuario y contraseña para continuar.</p>
      <div class="auth-field">
        <label for="auth-user">Usuario</label>
        <input id="auth-user" type="text" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="auth-pass">Contraseña</label>
        <input id="auth-pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="auth-button" type="submit">Entrar</button>
      <div id="auth-error" class="auth-error"></div>
    </form>
  </div>

  <script>
    // Staticrypt-style gate: user/password checked client-side before loading Flutter.
    const EXPECTED_USER_HASH = "423d6a455a29910d931980386762f0f4a7c06155fc8c3194a20b72c918ee9111";
    const EXPECTED_PASS_HASH = "98a58a9e710b7f631f47f98be6562080a22a36417769a6566060c2aa2d5351e3";
    const AUTH_STORAGE_KEY = "geoportal_staticrypt_auth_ok";

    const authRoot = document.getElementById("auth-root");
    const authForm = document.getElementById("auth-form");
    const authUser = document.getElementById("auth-user");
    const authPass = document.getElementById("auth-pass");
    const authError = document.getElementById("auth-error");

    function loadFlutterApp() {
      if (authRoot) {
        authRoot.style.display = "none";
      }
      const flutterScript = document.createElement("script");
      flutterScript.src = "flutter_bootstrap.js";
      flutterScript.async = true;
      document.body.appendChild(flutterScript);
    }

    async function sha256(input) {
      const data = new TextEncoder().encode(input);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hash))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function hasActiveSession() {
      return sessionStorage.getItem(AUTH_STORAGE_KEY) === "1";
    }

    function setActiveSession() {
      sessionStorage.setItem(AUTH_STORAGE_KEY, "1");
    }

    if (hasActiveSession()) {
      loadFlutterApp();
    } else {
      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        authError.textContent = "";

        const userHash = await sha256(authUser.value.trim());
        const passHash = await sha256(authPass.value);

        if (userHash === EXPECTED_USER_HASH && passHash === EXPECTED_PASS_HASH) {
          setActiveSession();
          loadFlutterApp();
          return;
        }

        authError.textContent = "Credenciales inválidas.";
      });
    }
  </script>
</body>
</html>
