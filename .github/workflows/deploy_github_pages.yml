name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          GEOPORTAL_CONSULTA_USER: ${{ secrets.GEOPORTAL_CONSULTA_USER }}
          GEOPORTAL_CONSULTA_PASSWORD: ${{ secrets.GEOPORTAL_CONSULTA_PASSWORD }}
        run: |
          flutter build web --release --pwa-strategy=none --base-href /geoportal_consulta/ \
            --dart-define=GEOPORTAL_CONSULTA_USER="$GEOPORTAL_CONSULTA_USER" \
            --dart-define=GEOPORTAL_CONSULTA_PASSWORD="$GEOPORTAL_CONSULTA_PASSWORD"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4