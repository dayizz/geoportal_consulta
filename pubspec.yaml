name: geoportal_consulta
description: "Geoportal de Consulta Pública - Visualización de predios por proyecto"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4

  # Mapas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.2
  http: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
